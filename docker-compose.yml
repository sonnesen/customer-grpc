services:
  postgres:
    image: postgres:16
    container_name: customer-grpc-postgres
    environment:
      POSTGRES_DB: customersdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - customer-grpc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d customersdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  customer-grpc-postgres-data:
