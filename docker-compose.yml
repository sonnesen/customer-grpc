services:
  postgres:
    image: postgres:16
    container_name: customer-grpc-postgres
    environment:
      POSTGRES_DB: customer_grpc
      POSTGRES_USER: customer_grpc
      POSTGRES_PASSWORD: customer_grpc
    ports:
      - "5432:5432"
    volumes:
      - customer-grpc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_grpc -d customer_grpc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  customer-grpc-postgres-data:
