name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      # customer-grpc-server's integration tests spin up PostgreSQL via
      # Testcontainers, which needs the Docker daemon that GitHub-hosted
      # runners already provide.
      - name: Build and test
        run: ./mvnw -B verify
